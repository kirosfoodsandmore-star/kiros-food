# Render Blueprint — Kiros API on the free plan.
# Render → New → Blueprint → pick this repo. You will be asked for the values marked `sync: false`.
# The database is an Aiven PostgreSQL service (DATABASE_URL), not a Render database.
# Free web services sleep after 15 minutes idle; the first request after that takes ~30-60 s.
services:
  - type: web
    name: kiros-api
    runtime: node
    plan: free
    region: frankfurt # closest Render region to West Africa
    rootDir: server
    buildCommand: npm ci
    # Free instances can't use a pre-deploy command, so migrations run on every start (a no-op when up to date).
    startCommand: npm run migration:run && npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      # ── Database (Aiven) ─────────────────────────────────────────────────
      # Same names as server/.env. (A single DATABASE_URL, e.g. postgres://avnadmin:…@HOST:PORT/defaultdb, also works
      # and takes priority over these five if you set it.)
      - key: DB_HOST
        sync: false # e.g. pg-xxxx-yourproject.j.aivencloud.com
      - key: DB_PORT
        sync: false # Aiven's port (not 5432)
      - key: DB_USER
        sync: false # avnadmin
      - key: DB_PASSWORD
        sync: false
      - key: DB_NAME
        sync: false # defaultdb
      - key: DB_SSL
        value: "true"
      - key: DB_POOL_MAX
        value: "5"
      - key: DB_LOGGING
        value: "false"
      # ── Auth & secrets ───────────────────────────────────────────────────
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: APP_ENCRYPTION_KEY
        generateValue: true # seals Paystack secret keys at rest
      - key: JWT_ACCESS_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 30d
      - key: OTP_TTL_MINUTES
        value: "15"
      - key: INVITE_TTL_HOURS
        value: "48"
      # ── URLs ─────────────────────────────────────────────────────────────
      - key: APP_URL
        sync: false # this service's URL, e.g. https://kiros-api.onrender.com
      # One web app address. The admin portal is the same site under /admin, so there is no separate admin URL.
      # In production the API accepts browser requests ONLY from CORS_ORIGINS and STOREFRONT_URL (no *.vercel.app
      # wildcard), so use the exact address with no trailing slash.
      - key: STOREFRONT_URL
        sync: false # e.g. https://kiros.vercel.app (email links, incl. https://kiros.vercel.app/admin, and the Paystack return)
      - key: CORS_ORIGINS
        sync: false # same address, comma-separated if more than one (e.g. a custom domain as well)
      - key: PAYSTACK_CALLBACK_URL
        sync: false # optional, defaults to STOREFRONT_URL/checkout/return
      # ── Firebase (Authentication + Firestore chat) ───────────────────────
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_CLIENT_EMAIL
        sync: false
      - key: FIREBASE_PRIVATE_KEY
        sync: false # the PEM on ONE line with literal \n between lines (as in the service-account JSON's "private_key")
      # Alternative to the three values above: FIREBASE_SERVICE_ACCOUNT_JSON = the whole service-account JSON on one line.
      - key: FIREBASE_API_KEY
        sync: false # Web API key (staff email/password verification)
      # ── File uploads ─────────────────────────────────────────────────────
      - key: CLOUDINARY_URL
        sync: false # cloudinary://key:secret@cloud_name
      # ── Email ────────────────────────────────────────────────────────────
      - key: EMAIL_ENABLED
        value: "true"
      # Pick ONE route with EMAIL_PROVIDER (you will be asked):
      #   script     = Google Apps Script relay: needs EMAIL_SCRIPT_URL. Plain HTTPS, so it works where SMTP is blocked.
      #   nodemailer = Gmail SMTP: needs EMAIL_USER + EMAIL_PASSWORD. Render may block outbound SMTP on the free plan.
      # With "script", EMAIL_USER/EMAIL_PASSWORD are optional: if present, a failed relay call falls back to Gmail SMTP.
      - key: EMAIL_PROVIDER
        sync: false # script | nodemailer (defaults to nodemailer if left empty)
      - key: EMAIL_SCRIPT_URL
        sync: false # the Apps Script web-app URL (required when EMAIL_PROVIDER=script)
      - key: EMAIL_USER
        sync: false # the Gmail address (also the fallback sender)
      - key: EMAIL_PASSWORD
        sync: false # Gmail App Password
      - key: EMAIL_FROM
        sync: false # e.g. Kiros <you@gmail.com>
      # ── Restaurant sign-up (open only until the first restaurant exists) ──
      - key: ALLOW_SIGNUP
        value: "false"
      - key: RIDER_ACCEPT_MINUTES
        value: "10"
      # ── Platform admin & realtime ────────────────────────────────────────
      - key: PLATFORM_ADMIN_EMAILS
        value: edoghotugiddy@gmail.com
      - key: SOCKET_ENABLED
        value: "true"
      - key: SCHEDULER_ENABLED
        value: "true"
      - key: SCHEDULER_INTERVAL_MINUTES
        value: "5"
