<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#14213d" />
    <link rel="icon" type="image/png" href="/src/assets/brand/kiros-favicon.png" />
    <!-- Installable app (customer site). The rider portal swaps these for its own while it is open (AdminLayout). -->
    <link rel="manifest" href="/kiros.webmanifest" />
    <link rel="apple-touch-icon" href="/app-apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="KIROS" />
    <!-- The browser offers install about a second after load, often BEFORE the app's JavaScript has finished downloading,
         so catch it here and hand it to lib/installApp.ts. Staff and rider pages keep the browser's default behaviour. -->
    <script>
      window.addEventListener("beforeinstallprompt", function (e) {
        if (/^\/(admin|staff|rider|team)(\/|$)/.test(location.pathname)) return;
        e.preventDefault();
        window.__installPrompt = e;
      });
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
    <link href="https://api.mapbox.com/mapbox-gl-js/v3.15.0/mapbox-gl.css" rel="stylesheet" />
    <title>Kiros</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
